{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Welcome Back</h2>
        <p>Login to your Kilgoris News account</p>

        <form action="{{ url_for('login') }}" method="POST">

            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       required
                       placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       required>
            </div>

            <button type="submit"
                    class="btn login-btn">
                Login
            </button>

        </form>

        <!-- GOOGLE LOGIN BUTTON -->
        <a href="{{ url_for('google_login') }}"
           class="google-btn">

            <img src="https://developers.google.com/identity/images/g-logo.png"
     style="width:20px; height:20px;">
            Continue with Google

        </a>

        <!-- FORGOT PASSWORD -->
        <p class="forgot-password">
            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>
        </p>

        <!-- REGISTER -->
        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Sign up here
            </a>
        </p>

    </div>

</div>

<style>

.auth-container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 15px;
}

.auth-card{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    width:100%;
    max-width:450px;
    box-sizing:border-box;
}

.auth-card h2{
    color:var(--navy);
    margin-bottom:10px;
    text-align:center;
}

.auth-card p{
    text-align:center;
}

.form-group{
    margin-bottom:15px;
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-weight:bold;
    margin-bottom:5px;
    color:#333;
}

.form-group input{
    padding:12px;
    border:1px solid #ddd;
    border-radius:4px;
    font-size:1rem;
    width:100%;
    box-sizing:border-box;
}

.login-btn{
    width:100%;
    border:none;
    margin:20px 0 10px 0;
}

.google-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:12px;
    background:white;
    border:1px solid #ddd;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
    margin-top:10px;
    color:#333;
    box-sizing:border-box;
    transition:0.3s;
}

.google-btn:hover{
    background:#f5f5f5;
}

.forgot-password{
    text-align:center;
    margin-top:18px;
    margin-bottom:10px;
}

.forgot-password a{
    color:var(--red);
    text-decoration:none;
    font-size:0.9rem;
}

.auth-footer{
    text-align:center;
    margin-top:20px;
    font-size:0.9rem;
}

.auth-footer a{
    color:var(--red);
    text-decoration:none;
    font-weight:bold;
}

/* MOBILE RESPONSIVE */

@media (max-width:768px){

    .auth-container{
        padding:30px 10px;
    }

    .auth-card{
        padding:25px;
    }

}

</style>

{% endblock %}
