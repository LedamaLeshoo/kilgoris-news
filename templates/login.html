{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Login to your Kilgoris News account</p>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn login-btn">Login</button>
        </form>

        <div style="margin: 20px 0; display: flex; align-items: center; text-align: center;">
            <hr style="flex: 1; border: 0; border-top: 1px solid #eee;">
            <span style="padding: 0 10px; color: #999; font-size: 0.8rem;">OR</span>
            <hr style="flex: 1; border: 0; border-top: 1px solid #eee;">
        </div>

        <a href="{{ url_for('google_login') }}" class="google-btn">
            <img src="https://developers.google.com/identity/images/g-logo.png" style="width:18px; height:18px;">
            Continue with Google
        </a>

        <p class="forgot-password" style="margin-top: 20px;">
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
        </p>

        <p style="margin-top: 10px;">
            New here? <a href="{{ url_for('register') }}" style="color: var(--red); font-weight: bold;">Create an Account</a>
        </p>
    </div>
</div>

<style>
    .auth-container { display: flex; justify-content: center; padding: 60px 0; background: var(--light-bg); }
    .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
    .auth-card h2 { color: var(--navy); margin-bottom: 5px; font-weight: 800; }
    .auth-card p { color: #666; font-size: 0.95rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; display: flex; flex-direction: column; text-align: left; }
    .form-group label { font-weight: bold; margin-bottom: 8px; color: #333; font-size: 0.9rem; }
    .form-group input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    .login-btn { background: var(--navy); color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; background: white; border: 1px solid #ddd; border-radius: 6px; text-decoration: none; font-weight: bold; color: #333; transition: background 0.2s; }
    .google-btn:hover { background: #f9f9f9; }
    .forgot-password a { color: #888; text-decoration: none; font-size: 0.9rem; }
</style>
{% endblock %}
