{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto;">
    <h2>List a Product</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required class="form-control">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" required class="form-control"></textarea>
        </div>
        <div class="form-group">
            <label>Price (KES)</label>
            <input type="number" name="price" step="0.01" required class="form-control">
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category" required class="form-control">
                <option value="">-- Select --</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home & Garden">Home & Garden</option>
                <option value="Vehicles">Vehicles</option>
                <option value="Others">Others</option>
            </select>
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" class="form-control" placeholder="e.g., Kilgoris Town">
        </div>
        <div class="form-group">
            <label>Product Image</label>
            <input type="file" name="image" accept="image/*" class="form-control-file">
        </div>
        <button type="submit" class="btn btn-success">Post Listing</button>
    </form>
</div>
{% endblock %}
